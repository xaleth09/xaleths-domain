<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>California Cannabis Flower Brand Guide (2026)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080d1a;
    --surface:#0d1526;
    --surface2:#111c33;
    --cyan:#00d4ff;
    --gold:#f5a623;
    --white:#ffffff;
    --sec:#7eb8cc;
    --muted:#2a4a5a;
    --line:rgba(0,212,255,0.18);
    --line2:rgba(0,212,255,0.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    background:var(--bg);color:var(--white);
    font-family:"DM Mono",monospace;-webkit-font-smoothing:antialiased;
  }
  body{
    background:radial-gradient(120% 80% at 50% 0%, #0e1830 0%, var(--bg) 55%);
    min-height:100vh;padding:40px 22px 64px;line-height:1.6;
  }
  .wrap{max-width:900px;margin:0 auto}

  /* ---- header ---- */
  header{margin-bottom:36px;border-bottom:1px solid var(--line);padding-bottom:24px}
  .kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--cyan)}
  h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:32px;
    letter-spacing:.01em;color:var(--white);margin:10px 0 10px;line-height:1.08}
  .sub{font-size:13px;color:var(--sec);max-width:64ch}

  /* ---- section ---- */
  section{margin-top:44px}
  h2{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:13px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:18px;
    display:flex;align-items:center;gap:12px}
  h2::after{content:"";flex:1;height:1px;background:var(--line)}

  /* ---- matrix table ---- */
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;
    background:var(--surface);box-shadow:0 0 24px rgba(0,212,255,0.06)}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
  thead th{text-align:left;font-family:"Space Grotesk",sans-serif;font-weight:600;
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);
    padding:14px 16px;border-bottom:1px solid var(--line2);white-space:nowrap}
  tbody td{padding:14px 16px;border-bottom:1px solid rgba(0,212,255,0.08);
    color:var(--sec);vertical-align:top}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface2)}
  .brand{color:var(--white);font-weight:500}
  .price{color:var(--gold);white-space:nowrap}

  /* ---- brand profiles ---- */
  .cards{display:grid;grid-template-columns:1fr;gap:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:20px 22px}
  .card:hover{border-color:var(--line2);box-shadow:0 0 20px rgba(0,212,255,0.08)}
  .cardhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .num{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:13px;color:var(--muted)}
  .cardtitle{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:16px;color:var(--white)}
  .tagline{font-size:11px;color:var(--cyan);letter-spacing:.04em}
  .vibe{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
  .card p{font-size:12.5px;color:var(--sec)}
  .card em{color:var(--white);font-style:italic}

  /* ---- playbook ---- */
  .playbook{display:grid;grid-template-columns:1fr;gap:10px}
  .play{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
  .play .goal{font-size:12.5px;color:var(--sec)}
  .play .pick{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:12.5px;
    color:var(--gold);text-align:right;white-space:nowrap}
  @media(max-width:520px){
    .play{grid-template-columns:1fr}
    .play .pick{text-align:left}
  }

  footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
    font-size:11px;color:var(--muted);letter-spacing:.06em}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">Buyer's Guide · California · 2026</div>
    <h1>Cannabis Flower Brand Guide</h1>
    <p class="sub" id="intro"></p>
  </header>

  <section>
    <h2 id="matrix-heading"></h2>
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>Brand</th>
            <th>Quality Tier</th>
            <th>Sourcing &amp; Cultivation</th>
            <th>Price</th>
            <th>Best Known For</th>
          </tr>
        </thead>
        <tbody id="matrix-body"></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>In-Depth Brand Profiles</h2>
    <div class="cards" id="profiles"></div>
  </section>

  <section>
    <h2>Shopping Playbook</h2>
    <div class="playbook" id="playbook"></div>
  </section>

  <footer>xaleth's domain · artifact · california cannabis flower guide 2026</footer>

</div>

<!-- ============================================================
     DATA — edit here. Add or change a brand by editing one object.
     Brands render in list order (highest tier first). The matrix,
     the numbered profiles, and the brand count all update automatically.
     `details` accepts inline HTML (e.g. <em>Strain Name</em>).
     ============================================================ -->
<script>
  const BRANDS = [
    {
      brand: "Heirbloom",
      tier: "Ultra-Premium (Boutique)",
      sourcing: "Strictly Indoor (Cultivated by CBX)",
      price: "$$$$ · $45–60+",
      knownFor: "Pure connoisseur terps & rare legacy cuts",
      tagline: "The Connoisseur's Pick",
      vibe: "High-end legacy craft",
      details: "Cultivated by the multi-award-winning Cannabiotix (CBX) team. Specializes in preserving clean, robust, rare legacy genetics (<em>Green Crack</em>, <em>Master Kush</em>, <em>Durban Poison</em>). Expect room-shaking aromas, maximum trichome coverage, and a pure entourage effect."
    },
    {
      brand: "CBX (Cannabiotix)",
      tier: "Ultra-Premium (Award-Winning Indoor)",
      sourcing: "Strictly Indoor, PGR-Free (Southern California)",
      price: "$$$$ · $40–55",
      knownFor: "55+ proprietary strains & 20+ Cannabis Cup wins",
      tagline: "The Award Machine",
      vibe: "Award-winning connoisseur indoor",
      details: "Founded in 2014 in Southern California on two principles — purity and potency — and the cultivation team behind Heirbloom. Grows 55+ exclusive proprietary strains strictly indoors (<em>Cereal Milk</em>, <em>Kush Mountains</em>, <em>Tropicanna</em>, <em>Super Silver Haze</em>, <em>White Walker OG</em>) with THC consistently 24–35%. PGR-free, pesticide-free, and vacuum-sealed right after testing. 20+ High Times Cannabis Cup wins."
    },
    {
      brand: "STIIIZY",
      tier: "Mid-High Premium (Potency-First)",
      sourcing: "Indoor & Greenhouse Mixed",
      price: "$$$ · $30–45+",
      knownFor: "High-potency flower & kief-infused \"40s\"",
      tagline: "The Powerhouse",
      vibe: "Mass-commercial, high-octane potency",
      details: "California powerhouse focusing on high-potency flower. Famous for their <em>40s line</em> — premium flower boosted to 40%+ THC by infusing buds with live resin and coating them in pure kief."
    },
    {
      brand: "Claybourne Co.",
      tier: "Mid-High Premium (Potency-First)",
      sourcing: "Strictly Indoor, Hand-Trimmed (Southern California)",
      price: "$$$ · $25–40",
      knownFor: "Big-nug Gold Cuts & Powerline infused flower",
      tagline: "The Big-Nug Specialist",
      vibe: "High-potency indoor with a value ladder",
      details: "Southern California indoor grower known for large nugs, high THC, and consistency. The product ladder spans value <em>Small Buds</em> (hand-trimmed indoor small flower in no-frills jars) up to flagship <em>Gold Cuts™</em> — the top ~10% of the grow — plus <em>Powerline™</em> live-resin-infused flower and half-ounce Big Bud jars. All lab-tested and pesticide-free."
    },
    {
      brand: "Henry's Original",
      tier: "Mid-Premium (Clean Organic)",
      sourcing: "Clean Green Certified Organic Sun-Grown",
      price: "$$ · $25–35",
      knownFor: "Smooth, small-batch Mendocino pre-rolls",
      tagline: "The Clean Smoke",
      vibe: "Artisanal and eco-conscious",
      details: "Grown in small batches across Mendocino County using strict <em>Clean Green Certified</em> organic practices. Avoids harsh chemical inputs, yielding an exceptionally smooth, natural, legacy-style smoke."
    },
    {
      brand: "Glass House Farms",
      tier: "Standard Value (Mid-Shelf Benchmark)",
      sourcing: "High-Tech Climate Greenhouse",
      price: "$$ · $20–25",
      knownFor: "True-to-strain flavor & eco-friendly glass jars",
      tagline: "The Daily Benchmark",
      vibe: "High-tech greenhouse quality at a fair price",
      details: "Climate-controlled greenhouses in Santa Barbara. Sets the standard for price-to-quality ratio. Properly cured, full-sized buds in glass jars — great terpene flavor on popular strains like <em>Super Boof</em> and <em>Lilac Diesel</em>."
    },
    {
      brand: "Pacific Stone",
      tier: "Standard Value (Everyday Mid-Shelf)",
      sourcing: "Sun-Grown Greenhouse",
      price: "$ · $18–23",
      knownFor: "100% single-source farm consistency",
      tagline: "The Reliable Standard",
      vibe: "Simple, honest, farm-direct weed",
      details: "Parent brand to Time Machine. Completely vertical, single-source family farm in Santa Barbara. Consistent, middle-of-the-road greenhouse flower — clean, functional, reliable."
    },
    {
      brand: "Time Machine",
      tier: "Budget Value (Affordable Bulk)",
      sourcing: "Hydroponic Greenhouse",
      price: "$ · $15–20",
      knownFor: "High-volume packaging & 28-pack pre-roll jars",
      tagline: "The Volume King",
      vibe: "Bulk party packs and budget daily smoking",
      details: "Same greenhouse ecosystem as Pacific Stone, focus shifted to bulk convenience. Pioneered value packaging formats like the 28-count, half-ounce pre-roll jar."
    },
    {
      brand: "Cloud",
      tier: "Budget Value (Affordable Everyday)",
      sourcing: "Mixed Greenhouse Supply",
      price: "$ · $15–18",
      knownFor: "Lowest possible price point for loose eighths",
      tagline: "The Ultra-Budget Option",
      vibe: "Practical \"working-class\" cannabis",
      details: "Lowest entry price for loose eighths and half-ounces. Lacks complex terpene depth and bag appeal but reliably delivers functional highs on classic strains (<em>Pink Runtz</em>, <em>OG Kush</em>)."
    }
  ];

  const PLAYBOOK = [
    { goal: "Top-tier flavor and complex effects, budget no object", pick: "Heirbloom" },
    { goal: "Award-winning indoor pedigree, Cannabis Cup–level genetics", pick: "CBX (Cannabiotix)" },
    { goal: "Heavy physical effects, high tolerance", pick: "STIIIZY" },
    { goal: "Big high-potency indoor nugs at a fair premium", pick: "Claybourne Co." },
    { goal: "Clean organic farming, old-school NorCal flower", pick: "Henry's Original" },
    { goal: "Best value-for-money jar of flavorful daily buds", pick: "Glass House Farms" },
    { goal: "Maximum volume of functional daily smoke, cheapest price", pick: "Pacific Stone / Time Machine / Cloud" }
  ];

  // ---- render ----------------------------------------------------------
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const pad2 = n => String(n).padStart(2, "0");

  // header count (numeral updates itself as brands are added)
  document.getElementById("intro").textContent =
    BRANDS.length + " prominent California cannabis flower brands, ranked from " +
    "ultra-premium boutique strains down to daily budget-value bulk buys.";
  document.getElementById("matrix-heading").textContent =
    "Complete " + BRANDS.length + "-Brand Quality Matrix";

  // matrix rows
  const body = document.getElementById("matrix-body");
  BRANDS.forEach(b => {
    const tr = el("tr");
    tr.appendChild(el("td", "brand", b.brand));
    tr.appendChild(el("td", null, b.tier));
    tr.appendChild(el("td", null, b.sourcing));
    tr.appendChild(el("td", "price", b.price));
    tr.appendChild(el("td", null, b.knownFor));
    body.appendChild(tr);
  });

  // profile cards (auto-numbered)
  const profiles = document.getElementById("profiles");
  BRANDS.forEach((b, i) => {
    const card = el("div", "card");
    const head = el("div", "cardhead");
    head.appendChild(el("span", "num", pad2(i + 1)));
    head.appendChild(el("span", "cardtitle", b.brand));
    head.appendChild(el("span", "tagline", b.tagline));
    card.appendChild(head);
    card.appendChild(el("div", "vibe", "Vibe · " + b.vibe));
    const p = el("p");
    p.innerHTML = b.details; // trusted, self-authored copy
    card.appendChild(p);
    profiles.appendChild(card);
  });

  // playbook
  const playbook = document.getElementById("playbook");
  PLAYBOOK.forEach(row => {
    const r = el("div", "play");
    r.appendChild(el("div", "goal", row.goal));
    r.appendChild(el("div", "pick", row.pick));
    playbook.appendChild(r);
  });
</script>
</body>
</html>
